spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:80MB}

openai:
  api-key: ${OPENAI_API_KEY:}
  responses-uri: ${OPENAI_RESPONSES_URI:https://api.openai.com/v1/responses}

rules:
  llm:
    primary-model: ${RULES_LLM_PRIMARY_MODEL:gpt-5-nano}
    fallback-model: ${RULES_LLM_FALLBACK_MODEL:gpt-5-mini}
    fallback-confidence-threshold: ${RULES_LLM_FALLBACK_CONFIDENCE_THRESHOLD:0.75}
    max-error-body-length: ${RULES_LLM_MAX_ERROR_BODY_LENGTH:500}
