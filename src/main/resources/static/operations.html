<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой аккаунт</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #202124;
            background: #f4f6f8;
        }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        a {
            color: #1f6feb;
            font-weight: 700;
            text-decoration: none;
        }

        section {
            background: #ffffff;
            border: 1px solid #d8dde3;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        dl {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px 18px;
            margin: 0;
        }

        dt {
            color: #5f6b7a;
            font-weight: 700;
        }

        dd {
            margin: 0;
        }

        button {
            border: 0;
            background: transparent;
            color: #b42318;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 0;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            border: 1px solid #c8d0d9;
            border-radius: 6px;
            padding: 10px;
            background: #ffffff;
            font: inherit;
        }

        label {
            color: #5f6b7a;
            font-size: 13px;
            font-weight: 700;
        }

        .manual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .finance-tools {
            display: grid;
            grid-template-columns: repeat(2, minmax(260px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .finance-panel {
            display: grid;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            background: #fbfcfe;
        }

        .finance-panel-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            padding: 0 14px;
            color: #202124;
            text-align: left;
        }

        .finance-panel-toggle::after {
            content: "+";
            color: #5f6b7a;
            font-size: 20px;
        }

        .finance-panel.open .finance-panel-toggle::after {
            content: "−";
        }

        .finance-panel-content {
            display: none;
            padding: 0 14px 14px;
        }

        .finance-panel.open .finance-panel-content {
            display: block;
        }

        .finance-panel form {
            gap: 10px;
        }

        .file-drop-zone {
            display: grid;
            place-items: center;
            min-height: 116px;
            border: 2px dashed #c8d0d9;
            border-radius: 8px;
            background: #ffffff;
            color: #5f6b7a;
            cursor: pointer;
            padding: 14px;
            text-align: center;
        }

        .file-drop-zone.drag-over {
            border-color: #1f6feb;
            background: #eef5ff;
            color: #244066;
        }

        .file-drop-zone input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .file-drop-title {
            display: block;
            color: #202124;
            font-weight: 700;
        }

        .file-drop-subtitle {
            display: block;
            margin-top: 4px;
            font-size: 13px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .primary-button {
            width: fit-content;
            min-height: 40px;
            border-radius: 6px;
            background: #1f6feb;
            color: #ffffff;
            padding: 0 16px;
        }

        .danger-button {
            width: fit-content;
            min-height: 40px;
            border-radius: 6px;
            background: #b42318;
            color: #ffffff;
            padding: 0 16px;
        }

        .text-danger-button {
            border-radius: 6px;
            color: #7b8794;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
        }

        .text-danger-button:hover {
            background: #fff1f0;
            color: #b42318;
        }

        .message {
            color: #5f6b7a;
        }

        .message.error {
            color: #b42318;
        }

        .message.success {
            color: #067647;
        }

        .finance-panel-toggle {
            color: #5f6b7a;
            font-size: 14px;
        }

        .manual-grid input,
        .manual-grid select {
            padding: 8px 10px;
        }

        .finance-panel .primary-button {
            min-height: 32px;
            background: #eef2f7;
            color: #344054;
            font-size: 14px;
            font-weight: 700;
        }

        .finance-panel .primary-button:hover {
            background: #e2e8f0;
        }

        .summary-label {
            color: #5f6b7a;
            font-size: 13px;
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            gap: 12px;
            border-color: #e5eaf0;
            background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-period {
            color: #667085;
            font-size: 13px;
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .dashboard-card {
            display: grid;
            gap: 6px;
            min-height: 86px;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            background: #ffffff;
            padding: 12px 14px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        }

        .dashboard-label {
            color: #667085;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .dashboard-value {
            color: #1f2328;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
        }

        .dashboard-note {
            color: #667085;
            font-size: 13px;
            font-weight: 700;
        }

        .expense-chart {
            display: grid;
            gap: 18px;
            margin-bottom: 18px;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            padding: 20px;
            background: #fbfcfe;
        }

        .chart-total {
            display: block;
            color: #2f3136;
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
        }

        .chart-title {
            display: block;
            margin-top: 8px;
            color: #3b3d42;
            font-size: 18px;
        }

        .chart-area {
            display: grid;
            place-items: center;
            min-height: 320px;
        }

        .donut-wrap {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .donut {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #edf1f6;
            box-shadow: 0 18px 34px rgba(31, 111, 235, 0.12);
        }

        .donut::after {
            content: "";
            position: absolute;
            inset: 58px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: inset 0 0 18px rgba(38, 54, 82, 0.06);
        }

        .donut-percent {
            position: absolute;
            color: #b7bec8;
            font-size: 18px;
            font-weight: 700;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            border-radius: 999px;
            padding: 6px 12px 6px 6px;
            background: var(--pill-bg);
            color: #2f3136;
            font-weight: 700;
        }

        .category-dot {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--dot-color);
            color: #ffffff;
            font-size: 15px;
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            background: var(--pill-bg);
            color: #2f3136;
            font-weight: 700;
            padding: 4px 9px;
        }

        .category-badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-color);
        }

        .operation-search {
            position: relative;
            margin-bottom: 12px;
        }

        .operation-search::before {
            content: "⌕";
            position: absolute;
            left: 12px;
            top: 50%;
            color: #7b8794;
            font-size: 18px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .operation-search input {
            padding-left: 38px;
        }

        mark.search-hit {
            border-radius: 3px;
            background: #fff2b8;
            color: inherit;
            padding: 0 2px;
        }

        .editable-cell {
            border-radius: 6px;
            cursor: pointer;
            transition: outline-color 0.15s ease, background-color 0.15s ease;
        }

        .editable-cell:hover {
            background: #f7f9fc;
            outline: 1px solid #c8d0d9;
        }

        .inline-editor {
            width: 100%;
            min-width: 120px;
            padding: 7px 9px;
        }

        .custom-chart {
            display: grid;
            gap: 14px;
            margin-bottom: 18px;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            padding: 18px;
            background: #ffffff;
        }

        .custom-chart h2 {
            margin: 0;
            font-size: 20px;
        }

        .custom-chart-form {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(150px, 0.3fr) minmax(150px, 0.3fr) minmax(150px, 0.3fr);
            gap: 12px;
            align-items: end;
        }

        .custom-chart-categories-field {
            display: grid;
            grid-column: 1 / -1;
            gap: 8px;
        }

        .custom-chart-category-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .custom-chart-categories {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 14px;
            align-items: start;
            border: 1px solid #e4e9f0;
            border-radius: 8px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
            padding: 12px;
        }

        .custom-chart-category-group {
            display: grid;
            gap: 10px;
            align-self: start;
            height: fit-content;
            min-width: 0;
            border: 1px solid var(--group-border);
            border-radius: 16px;
            background: var(--group-bg);
            padding: 12px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
        }

        .custom-chart-category-group-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--group-divider);
        }

        .custom-chart-category-group-title {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            color: #263238;
            font-size: 14px;
            font-weight: 700;
        }

        .custom-chart-category-group-icon {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: var(--group-accent);
            color: #ffffff;
            font-size: 14px;
        }

        .custom-chart-category-counter {
            min-width: 28px;
            border-radius: 10px;
            background: #ffffff;
            color: var(--group-accent);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }

        .custom-chart-category-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
            gap: 8px;
        }

        .custom-chart-category-group[data-category-type="income"] .custom-chart-category-list {
            grid-template-columns: 1fr;
        }

        .custom-chart-category {
            display: inline-flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            width: 100%;
            height: 52px;
            max-width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
            color: #536170;
            font-size: 13px;
            font-weight: 560;
            line-height: 1.2;
            padding: 9px 11px;
            cursor: pointer;
            transition: transform 0.16s ease, background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
        }

        .custom-chart-category:hover {
            transform: translateY(-1px);
            border-color: var(--group-border-strong);
            background: #ffffff;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.07);
        }

        .custom-chart-category-label {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .custom-chart-category input {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: 0;
            opacity: 0;
            pointer-events: none;
        }

        .custom-chart-category:has(input:checked) {
            border-color: var(--group-border-strong);
            background: var(--group-selected-bg);
            color: #1f2937;
            box-shadow: 0 8px 20px var(--group-shadow);
        }

        .custom-chart-category:has(input:focus-visible) {
            outline: 2px solid var(--group-accent);
            outline-offset: 2px;
        }

        .custom-chart-toggle {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            min-height: 40px;
            color: #344054;
        }

        .custom-chart-toggle input {
            width: auto;
            margin: 0;
        }

        .custom-chart-toggle.is-disabled {
            color: #98a2b3;
        }

        .custom-chart-canvas {
            display: grid;
            gap: 10px;
            min-height: 260px;
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid #edf1f6;
            border-radius: 8px;
            background: #fbfcfe;
            padding: 14px;
        }

        .custom-chart-canvas.is-heatmap {
            overflow: hidden;
        }

        .custom-chart-bars {
            position: relative;
            display: flex;
            gap: 14px;
            align-items: end;
            justify-content: flex-start;
            min-width: max-content;
            min-height: 218px;
            padding: 26px 4px 34px;
        }

        .custom-chart-average-line {
            position: absolute;
            right: 0;
            left: 0;
            bottom: calc(38px + var(--average-height));
            z-index: 1;
            border-top: 2px dashed #1f2937;
            color: #1f2937;
            font-size: 12px;
            font-weight: 800;
            pointer-events: none;
        }

        .custom-chart-average-line span {
            position: absolute;
            left: 0;
            bottom: 4px;
            border-radius: 999px;
            background: #ffffff;
            padding: 2px 6px;
        }

        .custom-chart-bar-wrap {
            position: relative;
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 8px;
            flex: 0 0 62px;
            width: 62px;
            height: 100%;
            outline: 0;
        }

        .custom-chart-bar {
            align-self: end;
            width: 100%;
            min-height: 2px;
            border-radius: 6px 6px 2px 2px;
            background: #4fc3d8;
        }

        .custom-chart-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% - 188px + var(--bar-height));
            z-index: 2;
            display: none;
            width: max-content;
            max-width: 180px;
            transform: translate(-50%, -8px);
            border-radius: 6px;
            background: #1f2937;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            padding: 6px 8px;
            text-align: center;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
            pointer-events: none;
        }

        .custom-chart-bar-wrap:hover .custom-chart-tooltip,
        .custom-chart-bar-wrap:focus .custom-chart-tooltip {
            display: block;
        }

        .custom-chart-bar-label {
            color: #5f6b7a;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            transform: rotate(-35deg);
            transform-origin: center top;
        }

        .custom-chart-summary {
            color: #5f6b7a;
            font-weight: 700;
        }

        .custom-chart-heatmaps {
            display: grid;
            gap: 18px;
            min-width: 0;
        }

        .custom-chart-heatmap {
            display: grid;
            gap: 10px;
        }

        .custom-chart-heatmap-year {
            color: #344054;
            font-size: 16px;
            font-weight: 800;
        }

        .heatmap-grid {
            display: grid;
            grid-template-columns: 28px repeat(53, minmax(4px, 1fr));
            grid-template-rows: 18px repeat(7, minmax(7px, 1fr));
            gap: 3px;
            align-items: center;
            width: 100%;
        }

        .heatmap-month {
            color: #80868d;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        .heatmap-weekday {
            grid-column: 1;
            color: #80868d;
            font-size: 12px;
            font-weight: 800;
            text-align: right;
            padding-right: 6px;
        }

        .heatmap-cell {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 3px;
            background: #e9edf2;
            outline: 0;
        }

        .heatmap-cell.is-zero {
            background: #f6f8fb !important;
            opacity: 0.55;
        }

        .heatmap-cell:hover,
        .heatmap-cell:focus {
            box-shadow: 0 0 0 2px rgba(31, 41, 55, 0.16);
        }

        .heatmap-cell:hover .custom-chart-tooltip,
        .heatmap-cell:focus .custom-chart-tooltip {
            display: block;
        }

        .heatmap-cell .custom-chart-tooltip {
            bottom: 100%;
            left: 50%;
            transform: translate(-50%, -6px);
        }

        .table-wrap {
            max-height: 620px;
            overflow: auto;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            background: #ffffff;
        }

        .table-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .period-selector {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .period-tabs {
            display: grid;
            gap: 8px;
        }

        .period-years,
        .period-months {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .period-months {
            border-top: 1px solid #e2e7ee;
            padding-top: 10px;
        }

        .period-tab {
            min-height: 36px;
            border: 1px solid #c8d0d9;
            border-radius: 6px;
            color: #244066;
            padding: 0 12px;
        }

        .period-tab.active {
            border-color: #1f6feb;
            background: #1f6feb;
            color: #ffffff;
        }

        .period-tab:disabled {
            color: #a8b2bf;
            cursor: default;
            opacity: 0.55;
        }

        .custom-period {
            display: none;
            grid-template-columns: repeat(2, minmax(180px, 1fr)) auto;
            gap: 12px;
            align-items: end;
        }

        .custom-period.visible {
            display: grid;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        .operations-table {
            min-width: 820px;
        }

        th,
        td {
            border-bottom: 1px solid #e2e7ee;
            padding: 8px 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #f8fafc;
            color: #5f6b7a;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .operations-table tbody tr {
            transition: background-color 0.16s ease, box-shadow 0.16s ease;
        }

        .operations-table tbody tr:nth-child(even) {
            background: #fbfcfe;
        }

        .operations-table tbody tr:hover {
            background: #eef6ff;
            box-shadow: inset 3px 0 0 #4f8fd9;
        }

        .operations-table tbody tr.edit-success {
            animation: rowSuccess 0.9s ease;
        }

        .operations-table tbody tr.edit-error {
            animation: rowError 0.9s ease;
        }

        @keyframes rowSuccess {
            0% { background: #dcfae6; }
            100% { background: transparent; }
        }

        @keyframes rowError {
            0% { background: #fee4e2; }
            100% { background: transparent; }
        }

        .operation-date {
            color: #344054;
            white-space: nowrap;
        }

        .operation-type {
            color: #667085;
            font-size: 13px;
            font-weight: 700;
        }

        .operation-description {
            color: #1f2328;
            font-weight: 700;
            line-height: 1.35;
        }

        .operation-amount {
            white-space: nowrap;
            text-align: right;
        }

        th.operation-amount {
            text-align: right;
        }

        .amount-negative {
            color: #b42318;
            font-weight: 700;
        }

        .amount-positive {
            color: #067647;
            font-weight: 700;
        }

        .editable-cell {
            position: relative;
            cursor: pointer;
            outline: 0;
        }

        .editable-value {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 28px;
            border-radius: 6px;
            padding: 3px 28px 3px 4px;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .edit-pencil {
            position: absolute;
            right: 8px;
            top: 50%;
            color: #98a2b3;
            opacity: 0;
            transform: translateY(-50%);
            transition: opacity 0.15s ease, color 0.15s ease;
            pointer-events: none;
        }

        .editable-cell:hover .editable-value,
        .editable-cell:focus .editable-value {
            background: #f2f6fb;
            box-shadow: inset 0 0 0 1px #cfd8e3;
        }

        .operations-table .editable-cell:hover {
            outline: 0;
        }

        .editable-cell:hover .edit-pencil,
        .editable-cell:focus .edit-pencil {
            opacity: 1;
        }

        .editable-cell.is-saving .editable-value {
            color: #667085;
            background: #f8fafc;
        }

        .editable-cell.is-error .editable-value {
            background: #fff1f0;
            box-shadow: inset 0 0 0 1px #fecdca;
        }

        .inline-edit-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #667085;
            font-size: 12px;
            font-weight: 800;
        }

        .inline-edit-status::before {
            content: "";
            width: 12px;
            height: 12px;
            border: 2px solid #c8d0d9;
            border-top-color: #4f8fd9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .operations-list-header {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .operations-list-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
            color: #5f6b7a;
            font-size: 13px;
            font-weight: 700;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pagination-button {
            min-height: 34px;
            border: 1px solid #c8d0d9;
            border-radius: 8px;
            color: #344054;
            padding: 0 12px;
        }

        .pagination-button:disabled {
            cursor: default;
            opacity: 0.45;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            main {
                padding: 28px 0;
            }

            nav {
                display: grid;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .donut-wrap {
                width: 240px;
                height: 240px;
            }

            .donut::after {
                inset: 48px;
            }

            .manual-grid {
                grid-template-columns: 1fr;
            }

            .finance-tools {
                grid-template-columns: 1fr;
            }

            .table-actions {
                display: grid;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .custom-period {
                grid-template-columns: 1fr;
            }

            .custom-chart-form {
                grid-template-columns: 1fr;
            }

            .custom-chart-categories {
                grid-template-columns: 1fr;
            }

            dl {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            dd {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
<main>
    <nav>
        <a href="/myacc">Dashboard</a>
        <a href="/operations">Операции</a>
        <button id="logout" type="button">Выйти</button>
    </nav>

    <section>
        <h1 id="title">Операции</h1>
        <div id="content" class="message">Загрузка...</div>
    </section>

    <section class="operations-section">
        <div class="operations-list-header">
            <h2>Управление операциями</h2>
        </div>
        <div class="finance-tools">
            <div class="finance-panel" data-panel="upload">
                <button class="finance-panel-toggle" type="button">Загрузить файл</button>
                <div class="finance-panel-content">
                    <form id="upload-form">
                        <label id="file-drop-zone" class="file-drop-zone" for="finance-file">
                            <input id="finance-file" name="files" type="file" accept=".xlsx,.xls" multiple required>
                            <span>
                                <span class="file-drop-title">Перетащи файлы сюда</span>
                                <span id="file-drop-subtitle" class="file-drop-subtitle">или нажми, чтобы выбрать XLS/XLSX</span>
                            </span>
                        </label>
                        <button class="primary-button" type="submit">Загрузить операции</button>
                        <div id="upload-message" class="message" aria-live="polite"></div>
                    </form>
                </div>
            </div>

            <div class="finance-panel" data-panel="manual">
                <button class="finance-panel-toggle" type="button">Добавить вручную</button>
                <div class="finance-panel-content">
                    <form id="manual-form">
                        <div class="manual-grid">
                            <label>
                                Тип
                                <select id="manual-type" name="type" required>
                                    <option value="expense">Расход</option>
                                    <option value="income">Доход</option>
                                </select>
                            </label>
                            <label>
                                Сумма
                                <input id="manual-amount" name="amount" type="number" step="0.01" min="0.01" required>
                            </label>
                            <label>
                                Валюта
                                <input id="manual-currency" name="currency" value="RUB" maxlength="10" required>
                            </label>
                            <label>
                                Категория
                                <input id="manual-category" name="category" placeholder="Прочий расход">
                            </label>
                            <label class="full-width">
                                Описание
                                <input id="manual-description" name="description" placeholder="Например: обед, зарплата, перевод">
                            </label>
                        </div>
                        <button class="primary-button" type="submit">Добавить</button>
                        <div id="manual-message" class="message" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
        <div class="table-actions">
            <button id="delete-selected" class="danger-button" type="button">Удалить выбранные</button>
            <span id="delete-message" class="message" aria-live="polite"></span>
        </div>
        <label class="operation-search">
            <input id="operation-search" type="search" placeholder="Поиск: Ozon, Пятёрочка, 5000..." autocomplete="off">
        </label>
        <div class="controls">
            <label>
                Тип операций
                <select id="operation-type-filter">
                    <option value="all">Доходы и расходы</option>
                    <option value="income">Только доходы</option>
                    <option value="expense">Только расходы</option>
                </select>
            </label>
            <label>
                Сортировка
                <select id="sort-mode">
                    <option value="date-desc">По дате: сначала новые</option>
                    <option value="date-asc">По дате: сначала давние</option>
                    <option value="amount-desc">По сумме: сначала большие</option>
                    <option value="amount-asc">По сумме: сначала маленькие</option>
                </select>
            </label>
            <label>
                Категория
                <select id="category-filter">
                    <option value="all">Все категории</option>
                </select>
            </label>
            <label id="transfer-person-control" hidden>
                Кому/от кого
                <select id="transfer-person-filter">
                    <option value="all">Все</option>
                </select>
            </label>
        </div>
        <div class="table-wrap">
            <table class="operations-table">
                <thead>
                <tr>
                    <th>
                        <input id="select-all" type="checkbox" aria-label="Выбрать все операции">
                    </th>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Категория</th>
                    <th>Описание</th>
                    <th class="operation-amount">Сумма</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="operations">
                <tr>
                    <td colspan="7" class="message">Загрузка...</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <span id="pagination-summary">0 операций</span>
            <div class="pagination-controls">
                <button id="pagination-prev" class="pagination-button" type="button">Назад</button>
                <span id="pagination-page">1 / 1</span>
                <button id="pagination-next" class="pagination-button" type="button">Вперёд</button>
            </div>
        </div>
    </section>

</main>

<script>
    const title = document.querySelector("#title");
    const content = document.querySelector("#content");
    const logoutButton = document.querySelector("#logout");
    const uploadForm = document.querySelector("#upload-form");
    const uploadMessage = document.querySelector("#upload-message");
    const financeFile = document.querySelector("#finance-file");
    const fileDropZone = document.querySelector("#file-drop-zone");
    const fileDropSubtitle = document.querySelector("#file-drop-subtitle");
    const financePanels = document.querySelectorAll(".finance-panel");
    const manualForm = document.querySelector("#manual-form");
    const manualMessage = document.querySelector("#manual-message");
    const manualType = document.querySelector("#manual-type");
    const manualCategory = document.querySelector("#manual-category");
    const operationsBody = document.querySelector("#operations");
    const selectAll = document.querySelector("#select-all");
    const operationSearch = document.querySelector("#operation-search");
    const sortMode = document.querySelector("#sort-mode");
    const operationTypeFilter = document.querySelector("#operation-type-filter");
    const categoryFilter = document.querySelector("#category-filter");
    const transferPersonControl = document.querySelector("#transfer-person-control");
    const transferPersonFilter = document.querySelector("#transfer-person-filter");
    const periodTabs = document.querySelector("#period-tabs");
    const customPeriodForm = document.querySelector("#custom-period-form");
    const deleteSelectedButton = document.querySelector("#delete-selected");
    const deleteMessage = document.querySelector("#delete-message");
    const paginationSummary = document.querySelector("#pagination-summary");
    const paginationPage = document.querySelector("#pagination-page");
    const paginationPrev = document.querySelector("#pagination-prev");
    const paginationNext = document.querySelector("#pagination-next");
    const income = document.querySelector("#income");
    const expenses = document.querySelector("#expenses");
    const balance = document.querySelector("#balance");
    const chartTotal = document.querySelector("#chart-total");
    const donutWrap = document.querySelector("#donut-wrap");
    const donut = document.querySelector("#donut");
    const categoryPills = document.querySelector("#category-pills");
    const dashboardPeriod = document.querySelector("#dashboard-period");
    const dashboardTopCategory = document.querySelector("#dashboard-top-category");
    const dashboardTopCategoryNote = document.querySelector("#dashboard-top-category-note");
    const customChartForm = document.querySelector("#custom-chart-form");
    const customChartCategories = document.querySelector("#custom-chart-categories");
    const customChartClearCategories = document.querySelector("#custom-chart-clear-categories");
    const customChartSelectCategories = document.querySelector("#custom-chart-select-categories");
    const customChartMetric = document.querySelector("#custom-chart-metric");
    const customChartType = document.querySelector("#custom-chart-type");
    const customChartAverage = document.querySelector("#custom-chart-average");
    const customChartSummary = document.querySelector("#custom-chart-summary");
    const customChartCanvas = document.querySelector("#custom-chart-canvas");
    let allOperations = [];
    let searchQuery = "";
    let searchTimer = null;
    let activeEditor = null;
    let currentPage = 1;
    const pageSize = 50;
    const operationFeedback = new Map();
    let selectedPeriod = { type: "all", key: null, from: null, to: null };
    const chartColors = ["#48b9cc", "#f18f55", "#55bd82", "#8b6fd8", "#4f8fd9", "#c4ccd6", "#e76f6f", "#d66fb1"];
    const categoryColors = {
        "Переводы": "#48b9cc",
        "Супермаркеты": "#f18f55",
        "Медицина": "#55bd82",
        "Цифровые товары": "#d66fb1",
        "Связь": "#4f8fd9",
        "Ж/д билеты": "#8b6fd8",
        "Образование": "#e76f6f",
        "Красота": "#df73b0",
        "Транспорт": "#4f8fd9",
        "Местный транспорт": "#4f8fd9",
        "Такси": "#4f8fd9",
        "Услуги банка": "#6f7d8f",
        "Сервис": "#6f7d8f",
        "Различные услуги": "#6f7d8f",
        "Аптеки": "#55bd82",
        "Маркетплейсы": "#8b6fd8",
        "Фастфуд": "#f18f55",
        "Бонусы": "#55bd82",
        "Прочий доход": "#55bd82",
        "Прочий расход": "#c4ccd6",
        "Остальное": "#c4ccd6",
        "Без категории": "#c4ccd6"
    };
    const categoryIcons = {
        "Переводы": "↔",
        "Супермаркеты": "🛒",
        "Медицина": "+",
        "Цифровые товары": "▣",
        "Связь": "◌",
        "Ж/д билеты": "▸",
        "Остальное": "…"
    };

    function getCategoryColor(categoryName) {
        const normalized = (categoryName || "Без категории").trim();
        if (categoryColors[normalized]) {
            return categoryColors[normalized];
        }

        const lower = normalized.toLowerCase();
        if (/(еда|супермаркет|фастфуд|кафе|ресторан|продукт|пят[её]р|перекр)/i.test(lower)) {
            return "#f18f55";
        }
        if (/(транспорт|такси|ж\/д|автобус|метро|билет)/i.test(lower)) {
            return "#4f8fd9";
        }
        if (/(мед|аптек|клиник|здоров)/i.test(lower)) {
            return "#55bd82";
        }
        if (/(маркет|ozon|wildberries|цифров|товар)/i.test(lower)) {
            return "#8b6fd8";
        }
        if (/(перевод|поступлен|вывод)/i.test(lower)) {
            return "#48b9cc";
        }
        if (/(образован|университет|курс|школ)/i.test(lower)) {
            return "#e76f6f";
        }
        if (/(сервис|услуг|банк|подпис)/i.test(lower)) {
            return "#6f7d8f";
        }
        return "#c4ccd6";
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }

        return new Intl.DateTimeFormat("ru-RU", {
            dateStyle: "medium",
            timeStyle: "short"
        }).format(new Date(value));
    }

    async function loadAccount() {
        const response = await fetch("/me");
        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }

        if (!response.ok) {
            content.textContent = "Не удалось загрузить аккаунт";
            return;
        }

        const user = await response.json();
        title.textContent = `Мой аккаунт: ${user.username}`;
        content.className = "";
        content.innerHTML = `
            <dl>
                <dt>ID</dt>
                <dd>${user.id}</dd>
                <dt>Имя</dt>
                <dd>${user.username}</dd>
                <dt>Email</dt>
                <dd>${user.email}</dd>
                <dt>Создан</dt>
                <dd>${formatDate(user.createdAt)}</dd>
            </dl>
        `;
    }

    function formatMoney(value, currency = "RUB") {
        return new Intl.NumberFormat("ru-RU", {
            style: "currency",
            currency
        }).format(value || 0);
    }

    function formatWholeMoney(value) {
        return new Intl.NumberFormat("ru-RU", {
            maximumFractionDigits: 0
        }).format(value || 0) + " ₽";
    }

    function formatChartValue(value, metric) {
        if (metric === "count") {
            return new Intl.NumberFormat("ru-RU").format(value || 0);
        }
        return formatWholeMoney(value);
    }

    function formatOperationDate(value) {
        if (!value) {
            return "";
        }

        return new Intl.DateTimeFormat("ru-RU", {
            dateStyle: "short",
            timeStyle: "short"
        }).format(new Date(value));
    }

    function getPeriodLabel() {
        if (selectedPeriod.type === "all") {
            return "Все время";
        }
        if (selectedPeriod.type === "year") {
            return `${selectedPeriod.year} год`;
        }
        if (selectedPeriod.type === "month") {
            return getMonthLabel(selectedPeriod.key);
        }
        if (selectedPeriod.type === "custom" && selectedPeriod.from && selectedPeriod.to) {
            const formatter = new Intl.DateTimeFormat("ru-RU", { dateStyle: "medium" });
            return `${formatter.format(selectedPeriod.from)} — ${formatter.format(selectedPeriod.to)}`;
        }
        return "Текущий период";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function normalizeSearchText(value) {
        return String(value ?? "").toLowerCase().replaceAll("ё", "е");
    }

    function getOperationType(operation) {
        return getOperationAmount(operation) < 0 ? "Расход" : "Доход";
    }

    function getSearchTokens() {
        return normalizeSearchText(searchQuery).split(/\s+/).filter(Boolean);
    }

    function highlightSearch(value) {
        const text = escapeHtml(value);
        const tokens = getSearchTokens();
        if (tokens.length === 0) {
            return text;
        }

        return tokens.reduce((result, token) => {
            const escapedToken = token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return result.replace(new RegExp(`(${escapedToken})`, "gi"), `<mark class="search-hit">$1</mark>`);
        }, text);
    }

    function isMatchingSearch(operation) {
        const tokens = getSearchTokens();
        if (tokens.length === 0) {
            return true;
        }

        const amount = getOperationAmount(operation);
        const searchText = normalizeSearchText([
            operation.description,
            operation.category,
            Math.abs(amount),
            amount,
            formatMoney(amount, operation.operationCurrency || "RUB"),
            getOperationType(operation)
        ].join(" "));

        return tokens.every((token) => searchText.includes(token));
    }

    function toDateInputValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function getOperationTime(operation) {
        return operation.operationDate ? new Date(operation.operationDate).getTime() : 0;
    }

    function getOperationAmount(operation) {
        return Number(operation.operationAmount || 0);
    }

    function compareOperations(first, second) {
        switch (sortMode?.value || "date-desc") {
            case "date-asc":
                return getOperationTime(first) - getOperationTime(second);
            case "amount-desc":
                return Math.abs(getOperationAmount(second)) - Math.abs(getOperationAmount(first));
            case "amount-asc":
                return Math.abs(getOperationAmount(first)) - Math.abs(getOperationAmount(second));
            case "date-desc":
            default:
                return getOperationTime(second) - getOperationTime(first);
        }
    }

    function getSortedOperations() {
        return [...allOperations].sort(compareOperations);
    }

    function isMatchingOperationType(operation) {
        if (!operationTypeFilter) {
            return true;
        }
        const amount = getOperationAmount(operation);
        if (operationTypeFilter.value === "income") {
            return amount >= 0;
        }
        if (operationTypeFilter.value === "expense") {
            return amount < 0;
        }
        return true;
    }

    function isMatchingCategory(operation) {
        if (!categoryFilter) {
            return true;
        }
        return categoryFilter.value === "all" || (operation.category || "Без категории") === categoryFilter.value;
    }

    function isMatchingTransferPerson(operation) {
        if (!categoryFilter || !transferPersonFilter) {
            return true;
        }
        if (categoryFilter.value !== "Переводы" || transferPersonFilter.value === "all") {
            return true;
        }
        return (operation.description || "Без описания") === transferPersonFilter.value;
    }

    function updateCategoryFilterOptions(operations) {
        if (!categoryFilter) {
            return;
        }
        const selectedCategory = categoryFilter.value;
        const categories = Array.from(new Set(
            operations
                .filter(isMatchingOperationType)
                .map((operation) => operation.category || "Без категории")
        )).sort((first, second) => first.localeCompare(second, "ru"));

        categoryFilter.innerHTML = "";
        categoryFilter.append(new Option("Все категории", "all"));
        categories.forEach((category) => {
            categoryFilter.append(new Option(category, category));
        });

        categoryFilter.value = categories.includes(selectedCategory) ? selectedCategory : "all";
    }

    function updateTransferPersonFilterOptions(operations) {
        if (!transferPersonControl || !transferPersonFilter || !categoryFilter) {
            return;
        }
        const isTransferCategory = categoryFilter.value === "Переводы";
        transferPersonControl.hidden = !isTransferCategory;

        if (!isTransferCategory) {
            transferPersonFilter.value = "all";
            return;
        }

        const selectedPerson = transferPersonFilter.value;
        const people = Array.from(new Set(
            operations
                .filter(isMatchingOperationType)
                .filter((operation) => (operation.category || "Без категории") === "Переводы")
                .map((operation) => operation.description || "Без описания")
        )).sort((first, second) => first.localeCompare(second, "ru"));

        transferPersonFilter.innerHTML = "";
        transferPersonFilter.append(new Option("Все", "all"));
        people.forEach((person) => {
            transferPersonFilter.append(new Option(person, person));
        });

        transferPersonFilter.value = people.includes(selectedPerson) ? selectedPerson : "all";
    }

    function getMonthKey(operation) {
        const date = operation.operationDate ? new Date(operation.operationDate) : null;
        return date ? `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}` : "no-date";
    }

    function getOperationYear(operation) {
        const date = operation.operationDate ? new Date(operation.operationDate) : null;
        return date ? date.getFullYear() : null;
    }

    function getMonthLabel(monthKey) {
        if (monthKey === "no-date") {
            return "Без даты";
        }

        const [year, month] = monthKey.split("-").map(Number);
        return new Intl.DateTimeFormat("ru-RU", {
            month: "long",
            year: "numeric"
        }).format(new Date(year, month - 1, 1));
    }

    function getShortMonthLabel(monthIndex) {
        const label = new Intl.DateTimeFormat("ru-RU", {
            month: "short"
        }).format(new Date(2026, monthIndex, 1));
        const cleanLabel = label.replace(".", "");
        return cleanLabel.charAt(0).toUpperCase() + cleanLabel.slice(1);
    }

    function getYears() {
        return Array.from(new Set(allOperations.map(getOperationYear).filter(Boolean)))
            .sort((first, second) => second - first);
    }

    function getMonthKeysForYear(year) {
        const keys = Array.from(new Set(allOperations
            .filter((operation) => getOperationYear(operation) === year)
            .map(getMonthKey)));
        return keys.sort((first, second) => second.localeCompare(first));
    }

    function isInSelectedPeriod(operation) {
        if (selectedPeriod.type === "all") {
            return true;
        }

        if (selectedPeriod.type === "year") {
            return getOperationYear(operation) === selectedPeriod.year;
        }

        if (selectedPeriod.type === "custom") {
            const time = getOperationTime(operation);
            return time >= selectedPeriod.from.getTime() && time <= selectedPeriod.to.getTime();
        }

        return getMonthKey(operation) === selectedPeriod.key;
    }

    function getCurrentPeriodOperations() {
        return getSortedOperations().filter(isInSelectedPeriod);
    }

    function getCurrentPeriodBounds(operations) {
        const dates = operations
            .map(getOperationDay)
            .filter(Boolean)
            .sort((first, second) => first - second);

        if (dates.length === 0) {
            return null;
        }

        const from = dates[0];
        const last = dates[dates.length - 1];
        const to = new Date(last.getFullYear(), last.getMonth(), last.getDate(), 23, 59, 59, 999);
        return { from, to };
    }

    function getOperationDay(operation) {
        const date = operation.operationDate ? new Date(operation.operationDate) : null;
        return date ? new Date(date.getFullYear(), date.getMonth(), date.getDate()) : null;
    }

    function getChartCategoryType(operation) {
        return getOperationAmount(operation) >= 0 ? "income" : "expense";
    }

    function getChartCategoryKey(type, category) {
        return `${type}::${category}`;
    }

    function getTypedCategoryLabel(type, category) {
        if (category === "Переводы") {
            return type === "income" ? "Входящие переводы" : "Исходящие переводы";
        }
        if ((category === "Прочий доход" || category === "Маркетплейсы") && type === "income") {
            return "Пополнения";
        }
        return category;
    }

    function getChartCategoryGroups() {
        const groups = {
            income: new Map(),
            expense: new Map()
        };
        const incomeCategoryOrder = ["Кэшбэк", "Возвраты", "Пополнения", "Переводы", "Зарплата", "Бонусы"];
        const incomeCategoryAliases = new Map([
            ["Прочий доход", "Пополнения"],
            ["Маркетплейсы", "Пополнения"]
        ]);

        allOperations.forEach((operation) => {
            const type = getChartCategoryType(operation);
            let category = operation.category || "Без категории";
            if (type === "income") {
                category = incomeCategoryAliases.get(category) || category;
                if (!incomeCategoryOrder.includes(category)) {
                    category = "Пополнения";
                }
            }
            groups[type].set(category, {
                key: getChartCategoryKey(type, category),
                type,
                category,
                label: getTypedCategoryLabel(type, category)
            });
        });

        incomeCategoryOrder.forEach((category) => {
            groups.income.set(category, {
                key: getChartCategoryKey("income", category),
                type: "income",
                category,
                label: getTypedCategoryLabel("income", category)
            });
        });

        return {
            income: Array.from(groups.income.values()).sort((first, second) => {
                return incomeCategoryOrder.indexOf(first.category) - incomeCategoryOrder.indexOf(second.category);
            }),
            expense: Array.from(groups.expense.values()).sort((first, second) => first.label.localeCompare(second.label, "ru"))
        };
    }

    function getChartCategoryValues() {
        const groups = getChartCategoryGroups();
        return [...groups.income, ...groups.expense];
    }

    function getSelectedChartCategoryKeys() {
        return Array.from(customChartCategories.querySelectorAll(".custom-chart-category-input:checked"))
            .map((checkbox) => checkbox.value);
    }

    function setAllChartCategories(checked) {
        customChartCategories.querySelectorAll(".custom-chart-category-input").forEach((checkbox) => {
            checkbox.checked = checked;
        });
        renderCustomChart();
    }

        const groups = getChartCategoryGroups();

        [

                type: "income",

                icon: "↑",
                items: groups.income,
                styles: {

                    "--group-bg": "#f5fbf7",
                    "--group-border": "#d8eee0",

                    "--group-selected-bg": "#eef8f1",
                    "--group-shadow": "rgba(47, 143, 98, 0.12)"
                }
            },

                type: "expense",
                title: "Расходы",
                icon: "↓",
                items: groups.expense,
                styles: {
                    "--group-accent": "#c96d3b",
                    "--group-bg": "#fff8f2",
                    "--group-border": "#f2dfcf",
                    "--group-border-strong": "#e2a277",
                    "--group-divider": "#f4e4d6",

                }

    function getChartBucket(date, useMonths) {
        if (useMonths) {
            return {
                key: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`,
                label: getShortMonthLabel(date.getMonth()) + " " + String(date.getFullYear()).slice(2)
            };
        }

        return {
            key: toDateInputValue(date),
            label: new Intl.DateTimeFormat("ru-RU", { day: "2-digit", month: "2-digit" }).format(date)
        };
    }

    function getChartBuckets(fromDate, toDate, useMonths) {
        const buckets = [];
        const cursor = useMonths
            ? new Date(fromDate.getFullYear(), fromDate.getMonth(), 1)
            : new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
        const end = useMonths
            ? new Date(toDate.getFullYear(), toDate.getMonth(), 1)
            : new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());

        while (cursor <= end) {
            buckets.push({ ...getChartBucket(cursor, useMonths), value: 0 });
            if (useMonths) {
                cursor.setMonth(cursor.getMonth() + 1);
            } else {
                cursor.setDate(cursor.getDate() + 1);
            }
        }

        return buckets;
    }

    function getChartData() {
        const periodOperations = getCurrentPeriodOperations();
        const bounds = getCurrentPeriodBounds(periodOperations);
        if (!bounds) {
            return null;
        }

        const selectedCategoryKeys = new Set(getSelectedChartCategoryKeys());
        if (selectedCategoryKeys.size === 0) {
            return { bounds, selectedCategoryKeys, operations: [], metric: customChartMetric.value };
        }

        const operations = periodOperations.filter((operation) => {
            const type = getChartCategoryType(operation);
            let category = operation.category || "Без категории";
            if (type === "income") {
                if (category === "Прочий доход" || category === "Маркетплейсы") {
                    category = "Пополнения";
                } else if (!["Кэшбэк", "Возвраты", "Пополнения", "Переводы", "Зарплата", "Бонусы"].includes(category)) {
                    category = "Пополнения";
                }
            }
            return getOperationDay(operation) && selectedCategoryKeys.has(getChartCategoryKey(type, category));
        });

        return {
            bounds,
            selectedCategoryKeys,
            operations,
            metric: customChartMetric.value
        };
    }

    function getChartSummaryText(total, metric, selectedCategoryKeys, groupingText, chartTypeText) {
        const allCategoryCount = getChartCategoryValues().length;
        const categoryText = selectedCategoryKeys.size === allCategoryCount
            ? "все категории"
            : `категорий: ${selectedCategoryKeys.size}`;
        return `${formatChartValue(total, metric)} за период, ${categoryText}, ${chartTypeText}, ${groupingText}`;
    }

    function getHeatmapColor(value, maxValue, metric) {
        if (value <= 0 || maxValue <= 0) {
            return "#e9edf2";
        }

        const ratio = Math.min(1, value / maxValue);
        if (metric === "count") {
            const lightness = 88 - Math.round(ratio * 48);
            return `hsl(142 55% ${lightness}%)`;
        }

        const lightness = 88 - Math.round(ratio * 46);
        return `hsl(213 68% ${lightness}%)`;
    }

    function formatHeatmapDate(date) {
        return new Intl.DateTimeFormat("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(date);
    }

    function getMondayStart(date) {
        const day = date.getDay() || 7;
        const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        start.setDate(start.getDate() - day + 1);
        return start;
    }

    function getWeeksBetween(startDate, date) {
        return Math.floor((getMondayStart(date) - startDate) / 604800000);
    }

    function getYearsBetween(fromDate, toDate) {
        const years = [];
        for (let year = fromDate.getFullYear(); year <= toDate.getFullYear(); year += 1) {
            years.push(year);
        }
        return years;
    }

    function renderBarChart(chartData) {
        customChartCanvas.classList.remove("is-heatmap");
        const { bounds, selectedCategoryKeys, operations, metric } = chartData;
        const { from: fromDate, to: toDate } = bounds;
        const dayCount = Math.ceil((toDate - fromDate) / 86400000) + 1;
        const useMonths = dayCount > 95;
        const buckets = getChartBuckets(fromDate, toDate, useMonths);
        const bucketByKey = new Map(buckets.map((bucket) => [bucket.key, bucket]));

        operations.forEach((operation) => {
            const operationDate = getOperationDay(operation);
            const bucket = bucketByKey.get(getChartBucket(operationDate, useMonths).key);
            if (bucket) {
                bucket.value += metric === "count" ? 1 : Math.abs(getOperationAmount(operation));
            }
        });

        const maxValue = Math.max(...buckets.map((bucket) => bucket.value), 0);
        const total = buckets.reduce((sum, bucket) => sum + bucket.value, 0);
        const average = buckets.length ? total / buckets.length : 0;
        const groupingText = `группировка: ${useMonths ? "по месяцам" : "по дням"}`;
        customChartSummary.textContent = getChartSummaryText(total, metric, selectedCategoryKeys, groupingText, "столбцы");

        if (maxValue === 0) {
            customChartCanvas.innerHTML = `<span class="message">За выбранный период и категории операций нет</span>`;
            return;
        }

        const color = metric === "count" ? "#38a169" : "#4f8fd9";
        customChartCanvas.innerHTML = `
            <div class="custom-chart-bars" style="--average-height: ${Math.round(average / maxValue * 180)}px">
                ${customChartAverage.checked ? `
                    <div class="custom-chart-average-line">
                        <span>Среднее: ${formatChartValue(average, metric)}</span>
                    </div>
                ` : ""}
                ${buckets.map((bucket) => {
                    const height = Math.max(2, Math.round(bucket.value / maxValue * 180));
                    const tooltip = `${bucket.label}: ${formatChartValue(bucket.value, metric)}`;
                    return `
                        <div class="custom-chart-bar-wrap" tabindex="0" style="--bar-height: ${height}px" aria-label="${tooltip}">
                            <span class="custom-chart-tooltip">${tooltip}</span>
                            <div class="custom-chart-bar" style="height: ${height}px; background: ${color}"></div>
                            <span class="custom-chart-bar-label">${bucket.label}</span>
                        </div>
                    `;
                }).join("")}
            </div>
        `;
    }

    function renderHeatmapChart(chartData) {
        customChartCanvas.classList.add("is-heatmap");
        const { bounds, selectedCategoryKeys, operations, metric } = chartData;
        const valueByDate = new Map();

        operations.forEach((operation) => {
            const operationDate = getOperationDay(operation);
            const key = toDateInputValue(operationDate);
            valueByDate.set(key, (valueByDate.get(key) || 0) + (metric === "count" ? 1 : Math.abs(getOperationAmount(operation))));
        });

        const values = Array.from(valueByDate.values());
        const maxValue = Math.max(...values, 0);
        const total = values.reduce((sum, value) => sum + value, 0);
        customChartSummary.textContent = getChartSummaryText(total, metric, selectedCategoryKeys, "группировка: по дням", "календарь");

        if (maxValue === 0) {
            customChartCanvas.innerHTML = `<span class="message">За выбранный период и категории операций нет</span>`;
            return;
        }

        const weekdayLabels = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const years = getYearsBetween(bounds.from, bounds.to);
        const yearBlocks = years.map((year) => {
            const yearStart = new Date(year, 0, 1);
            const yearEnd = new Date(year, 11, 31);
            const gridStart = getMondayStart(yearStart);
            const monthLabels = Array.from({ length: 12 }, (_, monthIndex) => {
                const monthDate = new Date(year, monthIndex, 1);
                const column = getWeeksBetween(gridStart, monthDate) + 2;
                return `<span class="heatmap-month" style="grid-column: ${column}; grid-row: 1">${getShortMonthLabel(monthIndex)}</span>`;
            }).join("");
            const weekdayMarkup = weekdayLabels.map((label, index) => (
                `<span class="heatmap-weekday" style="grid-row: ${index + 2}">${label}</span>`
            )).join("");
            const cells = [];
            const cursor = new Date(gridStart);
            const gridEnd = new Date(yearEnd);
            gridEnd.setDate(gridEnd.getDate() + (7 - (gridEnd.getDay() || 7)));

            while (cursor <= gridEnd) {
                const isCurrentYear = cursor.getFullYear() === year;
                const isSelectedPeriod = cursor >= bounds.from && cursor <= bounds.to;
                const key = toDateInputValue(cursor);
                const value = isCurrentYear && isSelectedPeriod ? (valueByDate.get(key) || 0) : 0;
                const week = getWeeksBetween(gridStart, cursor);
                const weekday = cursor.getDay() || 7;
                const tooltip = `${formatHeatmapDate(cursor)}: ${formatChartValue(value, metric)}`;
                const opacity = isCurrentYear && isSelectedPeriod ? 1 : 0.28;
                cells.push(`
                    <span class="heatmap-cell ${value === 0 ? "is-zero" : ""}" tabindex="0" aria-label="${tooltip}" style="grid-column: ${week + 2}; grid-row: ${weekday + 1}; background: ${getHeatmapColor(value, maxValue, metric)}; opacity: ${opacity}">
                        <span class="custom-chart-tooltip">${tooltip}</span>
                    </span>
                `);
                cursor.setDate(cursor.getDate() + 1);
            }

            return `
                <div class="custom-chart-heatmap">
                    <span class="custom-chart-heatmap-year">${year}</span>
                    <div class="heatmap-grid">
                        ${monthLabels}
                        ${weekdayMarkup}
                        ${cells.join("")}
                    </div>
                </div>
            `;
        }).join("");

        customChartCanvas.innerHTML = `<div class="custom-chart-heatmaps">${yearBlocks}</div>`;
    }

    function renderCustomChart() {
        if (!customChartSummary || !customChartCanvas || !customChartType || !customChartAverage) {
            return;
        }
        if (allOperations.length === 0) {
            customChartSummary.textContent = "Нет операций для графика";
            customChartCanvas.innerHTML = `<span class="message">Операции еще не загружены</span>`;
            return;
        }

        const isHeatmap = customChartType.value === "heatmap";
        customChartAverage.disabled = isHeatmap;
        customChartAverage.closest(".custom-chart-toggle").classList.toggle("is-disabled", isHeatmap);

        updateCustomChartCategoryOptions();
        const chartData = getChartData();
        if (!chartData) {
            customChartSummary.textContent = "Нет операций в выбранном периоде";
            customChartCanvas.innerHTML = `<span class="message">Выбери период, в котором есть операции</span>`;
            return;
        }

        if (chartData.selectedCategoryKeys.size === 0) {
            customChartSummary.textContent = "Выбери хотя бы одну категорию";
            customChartCanvas.innerHTML = `<span class="message">Для построения графика отметь одну или несколько категорий</span>`;
            return;
        }

        if (isHeatmap) {
            renderHeatmapChart(chartData);
            return;
        }

        renderBarChart(chartData);
    }

    function getVisibleOperations() {
        if (!operationsBody) {
            return getCurrentPeriodOperations();
        }
        return getCurrentPeriodOperations()
            .filter(isMatchingOperationType)
            .filter(isMatchingCategory)
            .filter(isMatchingTransferPerson)
            .filter(isMatchingSearch);
    }

    function renderPeriodTabs() {
        if (!periodTabs || !customPeriodForm) {
            selectedPeriod = { type: "all", key: null, from: null, to: null };
            return;
        }
        const years = getYears();
        periodTabs.innerHTML = "";

        if (years.length === 0) {
            selectedPeriod = { type: "all", key: null, from: null, to: null };
            return;
        }

        if (selectedPeriod.type === "year" && !years.includes(selectedPeriod.year)) {
            selectedPeriod = { type: "all", key: null, from: null, to: null };
        }

        if (selectedPeriod.type === "month") {
            const [year] = selectedPeriod.key ? selectedPeriod.key.split("-").map(Number) : [];
            const monthKeys = year ? getMonthKeysForYear(year) : [];
            if (!selectedPeriod.key || !monthKeys.includes(selectedPeriod.key)) {
                selectedPeriod = { type: "all", key: null, from: null, to: null };
            }
        }

        const yearsRow = document.createElement("div");
        yearsRow.className = "period-years";
        periodTabs.appendChild(yearsRow);
        const currentYear = selectedPeriod.year || (selectedPeriod.key ? Number(selectedPeriod.key.split("-")[0]) : null);

        const allButton = document.createElement("button");
        allButton.type = "button";
        allButton.className = `period-tab${selectedPeriod.type === "all" ? " active" : ""}`;
        allButton.dataset.periodType = "all";
        allButton.textContent = "Все";
        yearsRow.appendChild(allButton);

        years.forEach((year) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `period-tab${selectedPeriod.type !== "all" && currentYear === year ? " active" : ""}`;
            button.dataset.periodType = "year";
            button.dataset.year = String(year);
            button.textContent = String(year);
            yearsRow.appendChild(button);
        });

        const customButton = document.createElement("button");
        customButton.type = "button";
        customButton.className = `period-tab${selectedPeriod.type === "custom" ? " active" : ""}`;
        customButton.dataset.periodType = "custom";
        customButton.textContent = "Свой период";
        yearsRow.appendChild(customButton);

        if (selectedPeriod.type !== "all" && currentYear) {
            const monthsRow = document.createElement("div");
            monthsRow.className = "period-months";
            periodTabs.appendChild(monthsRow);

            const monthKeys = getMonthKeysForYear(currentYear);

            monthKeys.forEach((monthKey) => {
                const [, month] = monthKey.split("-").map(Number);
                const button = document.createElement("button");
                button.type = "button";
                button.className = `period-tab${selectedPeriod.type === "month" && monthKey === selectedPeriod.key ? " active" : ""}`;
                button.dataset.periodType = "month";
                button.dataset.periodKey = monthKey;
                button.dataset.year = String(currentYear);
                button.textContent = getShortMonthLabel(month - 1);
                monthsRow.appendChild(button);
            });
        }

        customPeriodForm.classList.toggle("visible", selectedPeriod.type === "custom");
    }

    function appendOperationRow(operation) {

        const row = document.createElement("tr");

        const type = getOperationType(operation);

        const feedback = operationFeedback.get(Number(operation.id));

            row.classList.add(feedback === "success" ? "edit-success" : "edit-error");
        }

                <button class="text-danger-button delete-one" type="button" data-id="${operation.id}">Удалить</button>
