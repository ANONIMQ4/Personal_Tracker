spring.application.name=app

spring.datasource.url=jdbc:postgresql://localhost:5432/personal_tracker
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always

ai.lmstudio.base-url=http://localhost:1234
ai.lmstudio.model=google/gemma-4-e2b
ai.lmstudio.connect-timeout-seconds=5
ai.lmstudio.read-timeout-seconds=120
ai.lmstudio.max-tokens=1800
