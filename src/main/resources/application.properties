spring.application.name=app
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/personal_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

openai.api-key=${OPENAI_API_KEY:}
rules.llm.primary-model=${RULES_LLM_PRIMARY_MODEL:gpt-5-nano}
rules.llm.fallback-model=${RULES_LLM_FALLBACK_MODEL:gpt-5-mini}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:80MB}
